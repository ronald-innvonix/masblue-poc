[project]
name = "ai-chat-service"
version = "0.1.0"
description = "Async AI chat microservice scaffold"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.15.2",
    "asyncpg==0.30.0",
    "fastapi==0.115.12",
    "gunicorn==23.0.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "python-dotenv==1.1.0",
    "sqlalchemy[asyncio]==2.0.40",
    "structlog==25.2.0",
    "uvicorn[standard]==0.34.0",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["jwt.*", "gunicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

